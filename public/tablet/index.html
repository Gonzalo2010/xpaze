<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B16">
<title>XPaze — pantalla para tablet</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>
/* Geist (SIL Open Font License), servida desde xpaze.es */
@font-face {
  font-family: 'Geist';
  font-style: normal;
  font-weight: 300 800;
  font-display: swap;
  src: url(/fonts/geist-300-800-latin-ext.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Geist';
  font-style: normal;
  font-weight: 300 800;
  font-display: swap;
  src: url(/fonts/geist-300-800-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

<style>
:root{
  --bg:#F5F6F8;--bg2:#FFFFFF;--ink:#0D1321;--muted:#5B6475;--faint:#8A93A3;--line:rgba(13,19,33,.10);--line2:rgba(13,19,33,.18);
  --pulse:#E5243F;--mind:#6D4AFF;--sky:#2F7BEA;--accent:var(--pulse);color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070B16;--bg2:#0F1626;--ink:#F2F4F8;--muted:#8C95A8;--faint:#5E687C;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);
  --pulse:#FF4D63;--mind:#9B85FF;--sky:#5AA2FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070B16;--bg2:#0F1626;--ink:#F2F4F8;--muted:#8C95A8;--faint:#5E687C;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);
  --pulse:#FF4D63;--mind:#9B85FF;--sky:#5AA2FF;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body.mind{--accent:var(--mind)}
button{font:inherit;color:inherit}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.aura{position:fixed;inset:-20%;pointer-events:none;filter:blur(20px);transition:opacity 1.2s;
  background:radial-gradient(45% 40% at 50% 40%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}

.view{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 4vmin) 6vmin calc(env(safe-area-inset-bottom,0px) + 9vmin);
  opacity:0;visibility:hidden;transform:scale(.97);filter:blur(10px);
  transition:opacity .8s cubic-bezier(.2,.7,.1,1),transform 1s cubic-bezier(.16,1,.3,1),filter .8s,visibility 0s linear .8s}
.view.on{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .9s cubic-bezier(.2,.7,.1,1),transform 1.1s cubic-bezier(.16,1,.3,1),filter .9s,visibility 0s}

/* logo */
.mark{width:min(30vmin,260px);height:auto;overflow:visible}
.mark path{fill:none;stroke:var(--pulse);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  filter:drop-shadow(0 0 6px color-mix(in srgb,var(--pulse) 70%,transparent))}
.on .mark path{animation:draw 3.2s cubic-bezier(.65,0,.35,1) infinite}
@keyframes draw{0%{stroke-dashoffset:1}45%,75%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.word{font-size:min(26vmin,20vw);font-weight:700;letter-spacing:-.065em;line-height:.9;margin:.06em 0 .12em -.04em;
  background:linear-gradient(100deg,var(--ink) 0%,var(--ink) 42%,var(--faint) 50%,var(--ink) 58%,var(--ink) 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s cubic-bezier(.4,0,.2,1) 1s infinite}
@keyframes sheen{0%{background-position:100% 0}45%,100%{background-position:0 0}}
.tag{font-size:min(3.6vmin,28px);color:var(--muted);letter-spacing:-.01em;margin:0;max-width:30ch;line-height:1.35}
.ecg{position:relative;width:100vw;height:min(18vmin,170px);margin:4vmin 0 3vmin}
.ecg canvas{position:absolute;inset:0;width:100%;height:100%}
.team{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.5em 1.2em;font-size:min(2.6vmin,20px);color:var(--muted);margin:0}
.team b{color:var(--ink);font-weight:600}
.team i{width:.5em;height:.5em;border-radius:50%;background:var(--pulse);box-shadow:0 0 10px var(--pulse);display:inline-block;animation:beat 0.91s ease-out infinite}
@keyframes beat{0%{transform:scale(1.5)}30%,100%{transform:scale(1)}}

/* Paze */
.orbhost{position:relative;width:min(78vmin,720px);aspect-ratio:1;margin:-6vmin 0 -5vmin}
.orbhost canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.orbhost.orb-fallback::before{content:"";position:absolute;left:50%;top:50%;width:54%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#6fd6ff 35%,#2f7bff 75%);box-shadow:0 0 80px #2f7bff88;animation:fb 4s ease-in-out infinite}
@keyframes fb{50%{transform:translate(-50%,-50%) scale(1.06)}}
.pname{font-size:min(9vmin,72px);font-weight:650;letter-spacing:-.05em;margin:0}
.psub{font-size:min(3vmin,24px);color:var(--muted);margin:.3em 0 0}

/* QR */
.qr{width:min(52vmin,440px);aspect-ratio:1;background:#fff;border-radius:min(4vmin,32px);padding:min(4vmin,30px);box-shadow:0 30px 80px -30px rgba(0,0,0,.6),0 0 0 1px var(--line2)}
.qr svg{width:100%;height:100%;display:block}
.qr path{stroke:#0D1321;fill:none}
.url{font-size:min(9vmin,76px);font-weight:700;letter-spacing:-.05em;margin:.45em 0 .1em}
.url span{color:var(--accent)}

/* controles */
.dots{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 3vmin);transform:translateX(-50%);display:flex;gap:10px;z-index:3;transition:opacity .6s}
.dots button{width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.dots button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line2);transition:all .4s}
.dots button[aria-current="true"]::before{width:26px;border-radius:9px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 2vmin);right:calc(env(safe-area-inset-right,0px) + 2vmin);display:flex;gap:8px;z-index:3;transition:opacity .6s}
.tools button{height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:color-mix(in srgb,var(--bg2) 70%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;display:inline-flex;align-items:center;gap:.5em;font-size:14px;font-weight:600}
.tools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.tools svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.calm .dots,body.calm .tools{opacity:0;pointer-events:none}
.tap{position:fixed;inset:0;z-index:2;background:transparent;border:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.mark path{stroke-dashoffset:0}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="aura" aria-hidden="true"></div>

<section class="view" id="v-logo" aria-label="Logotipo de XPaze">

<section class="view" id="v-qr" aria-label="Código QR de xpaze.es">
  <div class="qr" role="img" aria-label="Código QR que abre xpaze.es"><svg viewBox="-0.5 -0.5 26 26" shape-rendering="crispEdges"><path d="M0 0.5h7m1 0h2m3 0h2m1 0h1m1 0h7m-25 1h1m5 0h1m1 0h1m1 0h1m3 0h2m2 0h1m5 0h1m-25 1h1m1 0h3m1 0h1m1 0h1m4 0h2m1 0h1m1 0h1m1 0h3m1 0h1m-25 1h1m1 0h3m1 0h1m1 0h1m2 0h1m1 0h3m2 0h1m1 0h3m1 0h1m-25 1h1m1 0h3m1 0h1m1 0h2m1 0h2m1 0h1m1 0h1m1 0h1m1 0h3m1 0h1m-25 1h1m5 0h1m3 0h1m2 0h1m1 0h2m1 0h1m5 0h1m-25 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-17 1h2m2 0h3m-14 1h2m1 0h1m1 0h2m4 0h1m1 0h1m3 0h1m1 0h5m-25 1h1m1 0h4m1 0h2m1 0h1m3 0h1m1 0h1m1 0h1m5 0h1m-24 1h1m2 0h1m1 0h1m3 0h1m2 0h1m4 0h1m1 0h1m1 0h3m-25 1h2m1 0h1m1 0h1m9 0h3m1 0h2m2 0h1m-24 1h2m2 0h3m1 0h2m6 0h4m1 0h1m1 0h2m-17 1h1m2 0h1m1 0h1m2 0h3m2 0h1m2 0h1m-25 1h1m1 0h1m1 0h1m1 0h1m2 0h2m1 0h1m1 0h1m1 0h1m1 0h2m2 0h3m-24 1h3m1 0h1m3 0h1m1 0h1m4 0h1m3 0h1m2 0h1m-24 1h1m2 0h1m2 0h3m2 0h2m2 0h7m-14 1h1m1 0h2m2 0h3m3 0h2m1 0h2m-25 1h7m1 0h3m2 0h4m1 0h1m1 0h2m1 0h2m-25 1h1m5 0h1m2 0h1m2 0h1m2 0h2m3 0h2m1 0h1m-24 1h1m1 0h3m1 0h1m1 0h2m2 0h3m1 0h6m2 0h1m-25 1h1m1 0h3m1 0h1m3 0h2m7 0h4m-23 1h1m1 0h3m1 0h1m1 0h3m1 0h2m1 0h3m2 0h1m3 0h1m-25 1h1m5 0h1m1 0h3m1 0h1m2 0h4m1 0h2m1 0h1m-24 1h7m2 0h4m2 0h2m2 0h1m3 0h2"/></svg></div>
  <p class="url">xpaze<span>.</span>es</p>

  <button type="button" id="autoBtn" aria-pressed="true" title="Pasar solas cada 10 segundos (pulsa para dejarla fija)"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Auto</button>

<script>
(function(){
"use strict";
var RM=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function css(el,v){return getComputedStyle(el).getPropertyValue(v).trim();}
var cur=-1,parT=0;
/* ---------- trazos animados en canvas ---------- */
function Trace(cv,o){
  this.cv=cv;this.ctx=cv.getContext("2d");this.o=o;this.samples=[];this.t=0;this.acc=0;this.running=false;
  var self=this;this.resize();
  if(window.ResizeObserver)new ResizeObserver(function(){self.resize();}).observe(cv);
}
Trace.prototype.resize=function(){
  var r=this.cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
  this.w=r.width;this.h=r.height;this.cv.width=Math.max(1,Math.round(r.width*d));this.cv.height=Math.max(1,Math.round(r.height*d));
  this.ctx.setTransform(d,0,0,d,0,0);this.headX=this.w*(this.o.head||.86);
  var n=Math.max(2,Math.ceil(this.headX/this.o.sp)+2);
  while(this.samples.length<n)this.samples.unshift(0);
  if(this.samples.length>n)this.samples=this.samples.slice(this.samples.length-n);
  this.draw();
};
Trace.prototype.step=function(dt){
  this.acc+=dt*this.o.speed/this.o.sp;
  while(this.acc>=1){this.acc-=1;this.t+=this.o.sp/this.o.speed;this.samples.push(this.o.fn(this.t));this.samples.shift();}
};
Trace.prototype.prefill=function(sec){for(var i=0;i<sec*60;i++)this.step(1/60);};
Trace.prototype.draw=function(){
  var c=this.ctx,w=this.w,h=this.h;if(!w)return;
  c.clearRect(0,0,w,h);
  var col=css(this.cv,this.o.color)||"#f45",n=this.samples.length,base=h*(this.o.base||.62),amp=h*(this.o.amp||.52),sp=this.o.sp;
  c.save();c.lineWidth=this.o.lw||2.2;c.lineJoin="round";c.lineCap="round";c.strokeStyle=col;c.shadowColor=col;c.shadowBlur=14;
  c.beginPath();
  for(var i=0;i<n;i++){var x=this.headX-(n-1-i)*sp,y=base-this.samples[i]*amp;if(i===0)c.moveTo(x,y);else c.lineTo(x,y);}
  c.stroke();
  c.globalCompositeOperation="destination-in";
  var g=c.createLinearGradient(0,0,this.headX,0);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(.35,"rgba(0,0,0,.6)");g.addColorStop(1,"rgba(0,0,0,1)");
  c.fillStyle=g;c.fillRect(0,0,w,h);c.restore();
  var hy=base-this.samples[n-1]*amp;
  c.save();c.fillStyle=col;c.shadowColor=col;c.shadowBlur=24;c.beginPath();c.arc(this.headX,hy,4,0,Math.PI*2);c.fill();c.restore();
};
Trace.prototype.start=function(){
  if(this.running)return;
  if(RM){this.prefill(6);this.draw();return;}
  this.running=true;var self=this,prev=performance.now();
  (function loop(now){if(!self.running)return;var dt=Math.min(.05,(now-prev)/1000);prev=now;self.step(dt);self.draw();self.raf=requestAnimationFrame(loop);})(prev);
};
Trace.prototype.stop=function(){this.running=false;cancelAnimationFrame(this.raf);};

function ecgFn(bpm,onBeat){
  var last=0;
  return function(t){
    var per=60/bpm,p=(t%per)/per;
    if(onBeat&&last<.25&&p>=.25)onBeat();last=p;
    function g(c,w,a){return a*Math.exp(-((p-c)*(p-c))/(2*w*w));}
    return g(.12,.025,.12)+g(.232,.008,-.12)+g(.25,.011,1)+g(.27,.009,-.26)+g(.45,.042,.28);
  };
}

/* ---------- estrellas ---------- */
var sc=document.getElementById("stars"),sx=sc.getContext("2d"),stars=[],sw=0,sh=0,par=0,parT=0,mx=0,my=0;
function sResize(){var d=Math.min(window.devicePixelRatio||1,2);sw=innerWidth;sh=innerHeight;sc.width=sw*d;sc.height=sh*d;sx.setTransform(d,0,0,d,0,0);}
sResize();addEventListener("resize",sResize);
for(var i=0;i<260;i++)stars.push({x:Math.random(),y:Math.random(),z:.15+Math.random()*.85,ph:Math.random()*6.28});
addEventListener("pointermove",function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;});
function drawStars(now){
  par+=(parT-par)*.04;
  sx.clearRect(0,0,sw,sh);var col=css(document.body,"--ink")||"#fff";sx.fillStyle=col;
  for(var i=0;i<stars.length;i++){
    var s=stars[i],x=((s.x*sw+par*s.z*40+mx*s.z*-18)%sw+sw)%sw,y=s.y*sh+my*s.z*-12;
    sx.globalAlpha=s.z*.55*(.65+.35*Math.sin(now/900+s.ph));
    sx.beginPath();sx.arc(x,y,s.z*1.25,0,6.283);sx.fill();
  }
  sx.globalAlpha=1;
  if(!RM)requestAnimationFrame(drawStars);
}
requestAnimationFrame(drawStars);


/* ---------- Paze: orbe WebGL ---------- */
var PAZE_PRESETS={
  calma:{energy:.5,ripple:0,size:1,a:"#2f7bff",b:"#6fd6ff",c:"#b9a6ff"},
  escucha:{energy:1.1,ripple:1,size:1.03,a:"#17b8ff",b:"#5ef0ff",c:"#a8ecff"},
  empatia:{energy:.6,ripple:0,size:1.02,a:"#ff7a59",b:"#ffb38a",c:"#ff8fb8"},
  atencion:{energy:1.5,ripple:0,size:.95,a:"#ff9f0a",b:"#ffd166",c:"#ff6a3d"},
  respira:{energy:.35,ripple:0,size:1,a:"#19c38a",b:"#7be8b4",c:"#c4f5de"}
};
var ORB_VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}";
var ORB_FS=["precision highp float;",
"uniform vec2 uRes;uniform float uTime,uAmp,uBreath,uHeart,uEnergy,uRipple,uSize;uniform vec3 uA,uB,uC;uniform vec2 uMouse;",
"float hash(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}",
"float noise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);",
"return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),",
"mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}",
"float fbm(vec3 p){float v=0.0,a=0.5;for(int i=0;i<4;i++){v+=a*noise(p);p*=2.02;a*=0.5;}return v;}",
"void main(){float m=min(uRes.x,uRes.y);vec2 uv=(gl_FragCoord.xy-0.5*uRes)/m;float t=uTime;float ang=atan(uv.y,uv.x);float d=length(uv);",
"float R=0.27*uSize*(1.0+0.04*uBreath+0.035*uHeart);vec2 dir=vec2(cos(ang),sin(ang));",
"float n1=noise(vec3(dir*1.4,t*0.45*uEnergy));float n2=noise(vec3(dir*3.2+5.0,t*1.0*uEnergy));",
"float edge=R*(1.0+0.07*(n1-0.5)*2.0+0.03*(n2-0.5)*2.0+uAmp*0.12*(n2*2.0-1.0)+uAmp*0.05*sin(ang*6.0+t*8.0));",
"float px=1.6/m;float inside=1.0-smoothstep(edge-px,edge+px,d);float rr=clamp(d/edge,0.0,1.0);float z=sqrt(max(0.0,1.0-rr*rr));",
"vec3 N=normalize(vec3(uv/edge,z+0.001));vec3 p=N*1.7+vec3(0.0,0.0,t*0.16*uEnergy);float f=fbm(p+fbm(p*1.3+t*0.1*uEnergy));",
"vec3 col=mix(uA,uB,smoothstep(0.25,0.75,f));col=mix(col,uC,smoothstep(0.5,0.95,fbm(p*2.1-t*0.13*uEnergy))*0.8);",
"col+=0.12*uAmp*sin(N.y*9.0+t*9.0);vec3 L=normalize(vec3(-0.45+uMouse.x*0.35,0.6-uMouse.y*0.35,0.8));",
"float diff=clamp(dot(N,L)*0.5+0.5,0.0,1.0);col*=0.62+0.6*diff;float fres=pow(1.0-z,2.3);col+=uC*fres*0.95;",
"float spec=pow(max(dot(reflect(-L,N),vec3(0.0,0.0,1.0)),0.0),38.0);col+=vec3(1.0)*spec*0.5;",
"col+=uA*(1.0-rr)*(1.0-rr)*0.22*(1.0+uHeart*0.9+uAmp*0.7);float rip=0.0;",
"for(int i=0;i<3;i++){float ph=fract(t*0.32+float(i)/3.0);float rad=edge*(1.04+ph*0.85);float w=0.008+0.012*ph;rip+=exp(-pow((d-rad)/w,2.0))*(1.0-ph);}",
"float halo=exp(-max(d-edge,0.0)*8.0)*(0.5+0.3*uAmp+0.15*uHeart);vec3 outer=uB*halo+uC*rip*uRipple*0.8;",
"float fadeEdge=1.0-smoothstep(0.34,0.5,d);outer*=fadeEdge;float aOut=clamp(halo*0.9+rip*uRipple*0.7,0.0,1.0)*fadeEdge;vec3 rgb=col*inside+(1.0-inside)*outer*0.75;",
"float a=clamp(inside+(1.0-inside)*aOut*0.75,0.0,1.0);gl_FragColor=vec4(rgb,a);}"].join("\n");
function hex3(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];}
var ptrX=innerWidth/2,ptrY=innerHeight/2;
addEventListener("pointermove",function(e){ptrX=e.clientX;ptrY=e.clientY;},{passive:true});
function PazeOrb(host,o){
  o=o||{};this.host=host;this.rip=o.ripple;this.hr=o.hr||64;this.onMood=o.onMood||null;
  this.speaking=false;this.speechAmp=0;this.mouth=0;this.breathFn=null;this.clock=Math.random()*20;this.hp=0;this.smx=0;this.smy=0;this.running=false;
  var p=PAZE_PRESETS[o.mood||"calma"];this.mood=o.mood||"calma";
  this.cur={energy:p.energy,ripple:this.rip!=null?this.rip:p.ripple,size:p.size,a:hex3(p.a),b:hex3(p.b),c:hex3(p.c)};
  var cv=document.createElement("canvas");cv.setAttribute("aria-hidden","true");host.appendChild(cv);this.cv=cv;
  var gl=null;try{gl=cv.getContext("webgl",{alpha:true,premultipliedAlpha:true,antialias:true,preserveDrawingBuffer:true});}catch(err){}
  if(gl){
    var mk=function(type,src){var sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);return sh;};
    var prog=gl.createProgram();gl.attachShader(prog,mk(gl.VERTEX_SHADER,ORB_VS));gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,ORB_FS));gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS))gl=null;
    else{
      gl.useProgram(prog);var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      var loc=gl.getAttribLocation(prog,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
      var U=this.U={};["uRes","uTime","uAmp","uBreath","uHeart","uEnergy","uRipple","uSize","uA","uB","uC","uMouse"].forEach(function(n){U[n]=gl.getUniformLocation(prog,n);});
      gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    }
  }
  this.gl=gl;
  if(!gl){cv.remove();host.classList.add("orb-fallback");return;}
  var self=this;this.resize();
  if(window.ResizeObserver)new ResizeObserver(function(){self.resize();self.draw(0);}).observe(host);
  this.draw(0);
}
PazeOrb.prototype.resize=function(){if(!this.gl)return;var r=this.host.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
  this.cv.width=Math.max(2,Math.round(r.width*d));this.cv.height=Math.max(2,Math.round(r.height*d));this.gl.viewport(0,0,this.cv.width,this.cv.height);};
PazeOrb.prototype.setMood=function(m){if(!PAZE_PRESETS[m])return;this.mood=m;if(this.onMood)this.onMood(m);};
PazeOrb.prototype.draw=function(dt){
  var gl=this.gl;if(!gl)return;
  var tg=PAZE_PRESETS[this.mood],c=this.cur,k=1-Math.exp(-dt*5);
  c.energy+=(tg.energy-c.energy)*k;c.size+=(tg.size-c.size)*k;c.ripple+=((this.rip!=null?this.rip:tg.ripple)-c.ripple)*k;
  var ta=hex3(tg.a),tb=hex3(tg.b),tc=hex3(tg.c);for(var i=0;i<3;i++){c.a[i]+=(ta[i]-c.a[i])*k;c.b[i]+=(tb[i]-c.b[i])*k;c.c[i]+=(tc[i]-c.c[i])*k;}
  this.mouth+=((this.speaking?this.speechAmp:0)-this.mouth)*(1-Math.exp(-dt*16));
  var r=this.host.getBoundingClientRect(),mx=0,my=0;
  if(r.width){mx=Math.max(-1,Math.min(1,((ptrX-r.left)/r.width)*2-1));my=Math.max(-1,Math.min(1,((ptrY-r.top)/r.height)*2-1));}
  this.smx+=(mx-this.smx)*(1-Math.exp(-dt*5));this.smy+=(my-this.smy)*(1-Math.exp(-dt*5));
  var bv=.5+.5*Math.sin(this.clock*1.1),size=c.size,breathing=false;
  if(this.breathFn){var b=this.breathFn();if(b!=null){bv=b;size=c.size*(.78+.4*b);breathing=true;}}
  var listen=(this.mood==="escucha"&&!this.speaking&&!breathing)?Math.max(0,.16+.14*Math.sin(this.clock*3.1)*Math.sin(this.clock*1.3)+.05*Math.sin(this.clock*7.7)):0;
  var amp=Math.min(1.2,this.mouth*.95+listen);
  this.hp=(this.hp+dt*(this.hr/60))%1;var hb=Math.exp(-Math.pow((this.hp-.05)/.06,2))+.6*Math.exp(-Math.pow((this.hp-.3)/.07,2));
  var U=this.U,slow=RM?.35:1;
  gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U.uRes,this.cv.width,this.cv.height);gl.uniform1f(U.uTime,this.clock);gl.uniform1f(U.uAmp,amp);
  gl.uniform1f(U.uBreath,breathing?bv-.5:(bv-.5)*.7);gl.uniform1f(U.uHeart,RM?0:hb);
  gl.uniform1f(U.uEnergy,c.energy*slow*(1+amp*.5));gl.uniform1f(U.uRipple,c.ripple);gl.uniform1f(U.uSize,size);
  gl.uniform3f(U.uA,c.a[0],c.a[1],c.a[2]);gl.uniform3f(U.uB,c.b[0],c.b[1],c.b[2]);gl.uniform3f(U.uC,c.c[0],c.c[1],c.c[2]);
  gl.uniform2f(U.uMouse,this.smx,this.smy);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
};
PazeOrb.prototype.start=function(){
  if(this.running||!this.gl)return;this.running=true;var self=this,prev=performance.now();
  (function loop(now){if(!self.running)return;var dt=Math.min(.05,(now-prev)/1000);prev=now;self.clock+=dt;self.draw(dt);self.raf=requestAnimationFrame(loop);})(prev);
};
PazeOrb.prototype.stop=function(){this.running=false;cancelAnimationFrame(this.raf);this.speaking=false;this.speechAmp=0;this.breathFn=null;};


var ecg=new Trace(document.getElementById("ecg"),{fn:ecgFn(66),speed:190,sp:2,color:"--pulse"});
var orb=new PazeOrb(document.getElementById("orb"),{mood:"escucha",ripple:1,hr:64});
var moods=["escucha","calma"],mi=0,moodT=null;

var views=[].slice.call(document.querySelectorAll(".view")),dots=document.getElementById("dots");
var names=["Logo","Paze","Web"];
views.forEach(function(v,i){var b=document.createElement("button");b.type="button";b.setAttribute("aria-label",names[i]);
  b.addEventListener("click",function(e){e.stopPropagation();go(i);restartAuto();});dots.appendChild(b);});
function go(i){
  i=(i+views.length)%views.length;if(i===cur)return;cur=i;
  views.forEach(function(v,k){v.classList.toggle("on",k===i);v.toggleAttribute("inert",k!==i);});
  [].forEach.call(dots.children,function(b,k){b.setAttribute("aria-current",String(k===i));});
  var id=views[i].id;document.body.classList.toggle("mind",id==="v-paze");
  if(id==="v-logo")ecg.start();else ecg.stop();
  clearInterval(moodT);
  if(id==="v-paze"){orb.start();moodT=setInterval(function(){mi=(mi+1)%moods.length;orb.setMood(moods[mi]);},9000);}else orb.stop();
  try{history.replaceState(null,"","#"+["logo","paze","web"][i]);}catch(err){}
}
var start={logo:0,paze:1,web:2}[(location.hash||"").slice(1)];
go(start==null?0:start);

/* toque: mitad derecha avanza, izquierda retrocede; deslizar también */
var tx=null,moved=false;
var tap=document.getElementById("tap");
tap.addEventListener("pointerdown",function(e){tx=e.clientX;moved=false;});
tap.addEventListener("pointerup",function(e){
  if(tx===null)return;var dx=e.clientX-tx;tx=null;
  if(Math.abs(dx)>50){go(cur+(dx<0?1:-1));}else{go(cur+(e.clientX<innerWidth*.35?-1:1));}
  keepAwake();wake();restartAuto();
});
tap.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go(cur+1);}});
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(cur+1);else if(e.key==="ArrowLeft")go(cur-1);else if(e.key==="f"||e.key==="F")toggleFs();
});

/* modo automático */
var AUTO_MS=10000,autoT=null,autoBtn=document.getElementById("autoBtn");
function autoOn(){return autoBtn.getAttribute("aria-pressed")==="true";}
function restartAuto(){clearInterval(autoT);if(autoOn())autoT=setInterval(function(){go(cur+1);},AUTO_MS);}
autoBtn.addEventListener("click",function(e){e.stopPropagation();autoBtn.setAttribute("aria-pressed",String(!autoOn()));restartAuto();keepAwake();wake();});
restartAuto();

/* pantalla completa y pantalla siempre encendida */
var root=document.documentElement,lock=null;
function toggleFs(){try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
  else{(root.requestFullscreen||root.webkitRequestFullscreen).call(root);}}catch(err){}}
var fsBtn=document.getElementById("fsBtn");
if(!(root.requestFullscreen||root.webkitRequestFullscreen))fsBtn.style.display="none";
fsBtn.addEventListener("click",function(e){e.stopPropagation();toggleFs();keepAwake();});
function keepAwake(){try{if("wakeLock" in navigator&&!lock){navigator.wakeLock.request("screen").then(function(l){lock=l;l.addEventListener("release",function(){lock=null;});}).catch(function(){});}}catch(err){}}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")keepAwake();});

/* los controles se esconden solos para que la pantalla quede limpia */
var calmT;function wake(){document.body.classList.remove("calm");clearTimeout(calmT);calmT=setTimeout(function(){document.body.classList.add("calm");},3500);}
wake();
})();
</script>
