# xpaze.es (web, app, escena 3D, presentación y legal) servida desde /opt/xpaze/dist.
# La IA (server/psicologa.js) escucha en 127.0.0.1:5193. Sin túnel: Cloudflare conecta a esta IP.
# Certificado propio: sirve con el modo «Full» de Cloudflare. Para «Full (strict)», usar certbot.
upstream xpaze_ia { server 127.0.0.1:5193; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    listen 127.0.0.1:5190;          # comprobación local de scripts/deploy.sh
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xpaze.es www.xpaze.es;

    ssl_certificate /etc/letsencrypt/live/xpaze.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xpaze.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;                 # la política de privacidad dice que no se guardan visitas
    error_log /var/log/nginx/xpaze-error.log warn;

    root /opt/xpaze/dist;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain model/gltf-binary;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    # redirige a https lo que llegue por el puerto 80 público
    if ($server_port = 80) { return 301 https://$host$request_uri; }

    # una sola demo: la app
    location = /demo { return 302 /app/; }
    location /demo/ { return 302 /app/; }

    # IA: se quita el prefijo /app y no se almacena en búfer (respuestas en streaming)
    location ~ ^/app/(api/(espacio|psicologa|psicologa/resumen|explicar|voz/sesion|salud(/.*)?))$ {
        proxy_pass http://xpaze_ia/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # sin proxy de Cloudflare: la IP del visitante la pone nginx (no se acepta la que mande el cliente)
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location = /app/sw.js { add_header Cache-Control "no-cache"; }
    location = /presentacion/sw.js { add_header Cache-Control "no-cache"; }
    location = /app/manifest.webmanifest { default_type application/manifest+json; }
    location ~* \.glb$ { default_type model/gltf-binary; }

    # las páginas se revalidan siempre
    location / {
        try_files $uri $uri/ =404;
        location ~* (/|\.html)$ { add_header Cache-Control "no-cache"; }
    }
}
